<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Connectly</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-intro">
      <a class="brand brand-large" href="index.html">Connectly</a>
      <h1>Share moments. Build connections.</h1>
      <p>A simple place to post updates and connect with people.</p>
    </section>
    <section class="card auth-card">
      <h2>Welcome back</h2>
      <p class="muted">Log in to continue to your feed.</p>
      <div id="auth-message" class="message" role="alert" aria-live="polite"></div>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
        <button class="button button-primary button-full" type="submit">Log in</button>
      </form>
      <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
    </section>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
