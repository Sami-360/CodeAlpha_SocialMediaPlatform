<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Connectly</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-intro">
      <a class="brand brand-large" href="index.html">Connectly</a>
      <h1>Join the conversation.</h1>
      <p>Create your profile, share posts, and connect with others.</p>
    </section>
    <section class="card auth-card">
      <h2>Create account</h2>
      <p class="muted">It only takes a moment.</p>
      <div id="auth-message" class="message" role="alert" aria-live="polite"></div>
      <form id="register-form">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" maxlength="80" autocomplete="name" required>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" autocomplete="username" required>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required>
        <button class="button button-primary button-full" type="submit">Register</button>
      </form>
      <p class="auth-switch">Already registered? <a href="login.html">Log in</a></p>
    </section>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
